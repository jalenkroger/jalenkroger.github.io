<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jalen-Thomas Kroger | Portfolio</title>
<meta name="description" content="Journalist and storyteller — photos, writing, podcasts, and data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Permanent+Marker&family=Alex+Brush&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Intro splash: click-through gate, matches the old myportfolio.com "ENTER HERE" screen -->
  <div id="intro" class="intro">
    <button id="enter-btn" class="folder-btn" aria-label="Enter site">
      <svg class="folder-icon" viewBox="0 0 64 48" aria-hidden="true">
        <path d="M2 8 C2 5 4 3 7 3 H24 L30 9 H57 C60 9 62 11 62 14 V40 C62 43 60 45 57 45 H7 C4 45 2 43 2 40 Z"/>
      </svg>
      <span>ENTER<br>HERE</span>
    </button>
  </div>

  <nav class="topnav">
    <div class="nav-links">
      <a href="#home">Home</a>
      <a href="#work">Work</a>
      <a href="#contact">Contact</a>
    </div>
    <div class="signature">Jalen-Thomas Kroger</div>
    <div class="nav-spacer" aria-hidden="true"></div>
  </nav>

  <main>
    <section id="home" class="hero">
      <!-- Decorative retro-tech ephemera, purely visual -->
      <svg class="deco deco-tape" viewBox="0 0 120 80" aria-hidden="true"><use href="#i-cassette"/></svg>
      <svg class="deco deco-floppy" viewBox="0 0 100 100" aria-hidden="true"><use href="#i-floppy"/></svg>
      <svg class="deco deco-cd" viewBox="0 0 100 100" aria-hidden="true"><use href="#i-cd"/></svg>
      <svg class="deco deco-vhs" viewBox="0 0 140 90" aria-hidden="true"><use href="#i-vhs"/></svg>

      <div class="hero-frame">
        <div class="photo-frame">
          <!-- TODO: swap in a real portrait -->
          <div class="photo-placeholder">Photo</div>
        </div>
        <h1>Hi, I'm Jalen.</h1>
        <p class="tagline">Journalist &middot; Storyteller &middot; Data nerd</p>
        <a href="#work" class="scroll-cue">↓ see the work</a>
      </div>
    </section>

    <section id="work" class="work">
      <h2 class="section-title">The Work</h2>
      <p class="section-sub">// placeholder shelf — real links go here</p>

      <div class="shelf">
        <!-- TODO: replace href="#" and copy with real project links -->
        <a class="card card-cassette" href="#">
          <svg viewBox="0 0 120 80" aria-hidden="true"><use href="#i-cassette"/></svg>
          <span class="card-label">Podcasts</span>
        </a>
        <a class="card card-vhs" href="#">
          <svg viewBox="0 0 140 90" aria-hidden="true"><use href="#i-vhs"/></svg>
          <span class="card-label">Photos</span>
        </a>
        <a class="card card-floppy" href="#">
          <svg viewBox="0 0 100 100" aria-hidden="true"><use href="#i-floppy"/></svg>
          <span class="card-label">Data Stories</span>
        </a>
        <a class="card card-cd" href="#">
          <svg viewBox="0 0 100 100" aria-hidden="true"><use href="#i-cd"/></svg>
          <span class="card-label">Writing</span>
        </a>
      </div>
    </section>

    <section id="contact" class="contact">
      <div class="cable-row cable-row-top" aria-hidden="true"></div>
      <h2 class="connect-title">LET'S CONNECT</h2>
      <div class="social-row">
        <!-- TODO: point these at real profiles -->
        <a class="social" href="#" aria-label="X / Twitter"><svg viewBox="0 0 24 24"><use href="#i-x"/></svg></a>
        <a class="social" href="#" aria-label="LinkedIn"><svg viewBox="0 0 24 24"><use href="#i-linkedin"/></svg></a>
        <a class="social" href="#" aria-label="Instagram"><svg viewBox="0 0 24 24"><use href="#i-instagram"/></svg></a>
        <a class="social" href="#" aria-label="YouTube"><svg viewBox="0 0 24 24"><use href="#i-youtube"/></svg></a>
        <a class="social" href="mailto:jalenkroger@gmail.com" aria-label="Email"><svg viewBox="0 0 24 24"><use href="#i-mail"/></svg></a>
      </div>
      <div class="cable-row cable-row-bottom" aria-hidden="true"></div>
    </section>
  </main>

  <footer class="site-footer">
    <span>&copy; <span id="year"></span> Jalen-Thomas Kroger</span>
    <button id="top-btn" class="top-btn" aria-label="Back to top">↑</button>
  </footer>

  <!-- Shared icon defs, referenced via <use> above -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <g id="i-cassette">
        <rect x="2" y="2" width="116" height="76" rx="6" fill="none" stroke="currentColor" stroke-width="3"/>
        <circle cx="38" cy="40" r="14" fill="none" stroke="currentColor" stroke-width="3"/>
        <circle cx="82" cy="40" r="14" fill="none" stroke="currentColor" stroke-width="3"/>
        <circle cx="38" cy="40" r="4" fill="currentColor"/>
        <circle cx="82" cy="40" r="4" fill="currentColor"/>
        <rect x="24" y="60" width="72" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="2.5"/>
        <line x1="10" y1="14" x2="110" y2="14" stroke="currentColor" stroke-width="2.5"/>
      </g>
      <g id="i-floppy">
        <rect x="4" y="4" width="92" height="92" rx="4" fill="none" stroke="currentColor" stroke-width="3"/>
        <path d="M18 4 H72 L96 28 V92" fill="none" stroke="currentColor" stroke-width="3"/>
        <rect x="24" y="8" width="38" height="24" fill="none" stroke="currentColor" stroke-width="3"/>
        <rect x="20" y="54" width="60" height="38" fill="none" stroke="currentColor" stroke-width="3"/>
      </g>
      <g id="i-cd">
        <circle cx="50" cy="50" r="44" fill="none" stroke="currentColor" stroke-width="3"/>
        <circle cx="50" cy="50" r="14" fill="none" stroke="currentColor" stroke-width="3"/>
        <circle cx="50" cy="50" r="4" fill="currentColor"/>
        <path d="M50 6 A44 44 0 0 1 88 28" fill="none" stroke="currentColor" stroke-width="2" opacity="0.6"/>
      </g>
      <g id="i-vhs">
        <rect x="2" y="2" width="136" height="86" rx="6" fill="none" stroke="currentColor" stroke-width="3"/>
        <rect x="16" y="16" width="108" height="30" fill="none" stroke="currentColor" stroke-width="2.5"/>
        <circle cx="34" cy="68" r="12" fill="none" stroke="currentColor" stroke-width="3"/>
        <circle cx="106" cy="68" r="12" fill="none" stroke="currentColor" stroke-width="3"/>
      </g>
      <g id="i-x">
        <path d="M4 4 L20 20 M20 4 L4 20" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" transform="translate(0,0) scale(1)"/>
      </g>
      <g id="i-linkedin">
        <rect x="3" y="3" width="18" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <circle cx="8" cy="8.2" r="1.3" fill="currentColor"/>
        <rect x="6.8" y="10.5" width="2.4" height="7.5" fill="currentColor"/>
        <path d="M11.5 18 V10.5 H13.8 V11.6 C14.4 10.7 15.3 10.2 16.4 10.2 C18.2 10.2 19 11.4 19 13.4 V18 H16.6 V13.9 C16.6 13 16.3 12.4 15.4 12.4 C14.6 12.4 14.2 13 14.2 13.9 V18 Z" fill="currentColor"/>
      </g>
      <g id="i-instagram">
        <rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <circle cx="17.2" cy="6.8" r="1.1" fill="currentColor"/>
      </g>
      <g id="i-youtube">
        <rect x="2.5" y="6" width="19" height="12" rx="4" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M10 9.5 L15.5 12 L10 14.5 Z" fill="currentColor"/>
      </g>
      <g id="i-mail">
        <rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M4 6.5 L12 13 L20 6.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
      </g>
    </defs>
  </svg>

  <script src="script.js"></script>
</body>
</html>
